name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test and build tools
        run: python -m pip install --upgrade build pytest twine
      - name: Run unit tests
        run: python -m pytest
      - name: Verify package import
        run: python -c "import launch_control_workstation; print(launch_control_workstation.__version__)"
        env:
          PYTHONPATH: src
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify distribution metadata
        run: python -m twine check dist/*
      - name: Install the built wheel
        run: python -m pip install --force-reinstall dist/*.whl
      - name: Verify installed command and diagnostics
        run: |
          workstation version
          workstation doctor || test "$?" -eq 1
