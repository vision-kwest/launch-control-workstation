[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "launch-control-workstation"
dynamic = ["version"]
description = "Provision and manage a persistent AWS infrastructure control workstation"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Vision Kwest" }]
keywords = ["aws", "cli", "cloud", "devops", "ec2", "infrastructure", "opentofu", "workstation"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Vision-Kwest/launch-control-workstation"
Documentation = "https://github.com/Vision-Kwest/launch-control-workstation#readme"
Repository = "https://github.com/Vision-Kwest/launch-control-workstation"
Issues = "https://github.com/Vision-Kwest/launch-control-workstation/issues"
Changelog = "https://github.com/Vision-Kwest/launch-control-workstation/blob/main/CHANGELOG.md"
Releases = "https://github.com/Vision-Kwest/launch-control-workstation/releases"
PyPI = "https://pypi.org/project/launch-control-workstation/"

[project.scripts]
workstation = "launch_control_workstation.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["build>=1.2", "pytest>=8", "ruff==0.15.12", "twine>=5"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.version]
path = "src/launch_control_workstation/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/launch_control_workstation"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE",
  "/pyproject.toml",
]
